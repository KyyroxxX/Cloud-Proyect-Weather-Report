<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Dark Tech Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="1.8" stroke-opacity="0.5"/>

  <!-- Radar Pulse Rings -->
  <circle cx="32" cy="32" r="23" fill="none" stroke="#38bdf8" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.3"/>
  <circle cx="32" cy="32" r="15" fill="none" stroke="#38bdf8" stroke-width="0.8" opacity="0.2"/>

  <!-- Weather Cloud -->
  <path d="M22 36 a8 8 0 0 1 14 -5 a11 11 0 0 1 14 7 a6 6 0 0 1 -3 9 H22 a6 6 0 0 1 0 -11 z" 
        fill="url(#cloudGrad)" filter="url(#glow)"/>

  <!-- Golden Lightning Bolt -->
  <polygon points="34,26 27,38 33,38 29,49 41,36 35,36" fill="url(#boltGrad)" filter="url(#glow)"/>

  <!-- Telemetry Beacon Point -->
  <circle cx="45" cy="19" r="2" fill="#38bdf8" filter="url(#glow)"/>
</svg>
